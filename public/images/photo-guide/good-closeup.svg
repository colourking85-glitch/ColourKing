<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="focusRing" cx="0.5" cy="0.5">
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="80%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#1a1f2e"/>
  <!-- Car panel surface -->
  <rect width="400" height="300" fill="#2563eb" opacity="0.7"/>
  <path d="M0 80 Q100 60 200 85 Q300 110 400 80 L400 220 Q300 200 200 215 Q100 230 0 210Z" fill="#3b82f6" opacity="0.3"/>
  <!-- Surface texture lines -->
  <line x1="0" y1="100" x2="400" y2="90" stroke="#4a8af5" stroke-width="0.5" opacity="0.2"/>
  <line x1="0" y1="150" x2="400" y2="145" stroke="#4a8af5" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="200" x2="400" y2="195" stroke="#4a8af5" stroke-width="0.5" opacity="0.2"/>
  <!-- Damage area: scratch cluster -->
  <path d="M100 100 Q180 80 260 110 Q310 125 330 170 L320 210 Q260 190 180 200 Q120 208 90 190 L80 150 Q85 120 100 100Z" fill="#dc2626" opacity="0.35"/>
  <!-- Deep scratches -->
  <path d="M120 115 Q180 105 260 120" fill="none" stroke="#fca5a5" stroke-width="2.5" opacity="0.8"/>
  <path d="M110 135 Q190 120 280 140" fill="none" stroke="#fca5a5" stroke-width="2" opacity="0.6"/>
  <path d="M115 155 Q200 140 300 160" fill="none" stroke="#fca5a5" stroke-width="1.5" opacity="0.5"/>
  <path d="M130 172 Q210 158 270 175" fill="none" stroke="#fca5a5" stroke-width="1" opacity="0.4"/>
  <!-- Paint chips -->
  <path d="M160 110 Q168 100 180 105 Q185 95 195 100" fill="none" stroke="#fca5a5" stroke-width="2" opacity="0.7"/>
  <path d="M230 125 Q238 118 245 122 Q248 115 255 118" fill="none" stroke="#fca5a5" stroke-width="1.5" opacity="0.6"/>
  <!-- Dent shadow -->
  <ellipse cx="200" cy="155" rx="50" ry="35" fill="#1e40af" opacity="0.2"/>
  <!-- Focus ring / magnifier overlay -->
  <circle cx="200" cy="150" r="100" fill="url(#focusRing)"/>
  <circle cx="200" cy="150" r="100" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
  <!-- Corner brackets showing "focused area" -->
  <path d="M115 70 L115 55 L130 55" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
  <path d="M285 55 L300 55 L300 70" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
  <path d="M115 240 L115 255 L130 255" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
  <path d="M285 255 L300 255 L300 240" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
  <!-- Distance indicator -->
  <text x="345" y="150" text-anchor="middle" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="10" opacity="0.6" transform="rotate(90 345 150)">30cm</text>
  <line x1="335" y1="80" x2="335" y2="220" stroke="#fbbf24" stroke-width="0.8" opacity="0.3" stroke-dasharray="3 3"/>
  <!-- Label -->
  <rect x="12" y="258" width="170" height="28" rx="4" fill="#065f46" opacity="0.9"/>
  <text x="97" y="277" text-anchor="middle" fill="#34d399" font-family="system-ui,sans-serif" font-size="12" font-weight="600">CLOSE-UP DETAIL</text>
  <!-- Checkmark badge -->
  <circle cx="370" cy="25" r="16" fill="#059669" opacity="0.9"/>
  <path d="M362 25 L367 30 L378 19" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>