<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#1a1f2e"/>
  <rect width="400" height="210" fill="url(#sky2)"/>
  <!-- Far away ground/parking lot -->
  <rect x="0" y="210" width="400" height="90" fill="#1f2937"/>
  <!-- Parking lines -->
  <line x1="50" y1="210" x2="30" y2="300" stroke="#374151" stroke-width="1.5" opacity="0.3"/>
  <line x1="130" y1="210" x2="110" y2="300" stroke="#374151" stroke-width="1.5" opacity="0.3"/>
  <line x1="210" y1="210" x2="190" y2="300" stroke="#374151" stroke-width="1.5" opacity="0.3"/>
  <line x1="290" y1="210" x2="270" y2="300" stroke="#374151" stroke-width="1.5" opacity="0.3"/>
  <line x1="370" y1="210" x2="350" y2="300" stroke="#374151" stroke-width="1.5" opacity="0.3"/>
  <!-- Buildings in background -->
  <rect x="20" y="100" width="60" height="110" fill="#111827" opacity="0.5"/>
  <rect x="90" y="120" width="45" height="90" fill="#111827" opacity="0.4"/>
  <rect x="300" y="90" width="70" height="120" fill="#111827" opacity="0.5"/>
  <!-- Tiny windows -->
  <rect x="30" y="110" width="8" height="8" fill="#374151" opacity="0.3"/>
  <rect x="45" y="110" width="8" height="8" fill="#374151" opacity="0.3"/>
  <rect x="60" y="110" width="8" height="8" fill="#374151" opacity="0.3"/>
  <rect x="30" y="125" width="8" height="8" fill="#374151" opacity="0.3"/>
  <rect x="45" y="125" width="8" height="8" fill="#374151" opacity="0.3"/>
  <rect x="310" y="100" width="10" height="10" fill="#374151" opacity="0.3"/>
  <rect x="330" y="100" width="10" height="10" fill="#374151" opacity="0.3"/>
  <rect x="350" y="100" width="10" height="10" fill="#374151" opacity="0.3"/>
  <!-- TINY car in the distance -->
  <rect x="170" y="195" width="55" height="20" rx="4" fill="#2563eb" opacity="0.7"/>
  <path d="M180 195 L185 185 Q188 182 197 182 L207 182 Q212 182 215 185 L218 195" fill="#1d4ed8" opacity="0.6"/>
  <circle cx="180" cy="215" r="6" fill="#111827" stroke="#374151" stroke-width="1"/>
  <circle cx="218" cy="215" r="6" fill="#111827" stroke="#374151" stroke-width="1"/>
  <!-- Tiny damage dot - barely visible -->
  <circle cx="215" cy="200" r="2" fill="#dc2626" opacity="0.5"/>
  <!-- Arrow pointing to tiny damage with "?" -->
  <line x1="250" y1="175" x2="220" y2="198" stroke="#fbbf24" stroke-width="1" opacity="0.5" stroke-dasharray="3 2"/>
  <text x="260" y="172" text-anchor="middle" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="16" font-weight="700" opacity="0.5">?</text>
  <!-- Distance indicator -->
  <line x1="60" y1="260" x2="340" y2="260" stroke="#6b7280" stroke-width="1" opacity="0.4"/>
  <line x1="60" y1="255" x2="60" y2="265" stroke="#6b7280" stroke-width="1" opacity="0.4"/>
  <line x1="340" y1="255" x2="340" y2="265" stroke="#6b7280" stroke-width="1" opacity="0.4"/>
  <text x="200" y="275" text-anchor="middle" fill="#6b7280" font-family="system-ui,sans-serif" font-size="10" opacity="0.5">too far away</text>
  <!-- Label -->
  <rect x="12" y="258" width="140" height="28" rx="4" fill="#7f1d1d" opacity="0.9"/>
  <text x="82" y="277" text-anchor="middle" fill="#fca5a5" font-family="system-ui,sans-serif" font-size="12" font-weight="600">TOO FAR AWAY</text>
  <!-- X badge -->
  <circle cx="370" cy="25" r="16" fill="#dc2626" opacity="0.9"/>
  <path d="M363 18 L377 32 M377 18 L363 32" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
</svg>