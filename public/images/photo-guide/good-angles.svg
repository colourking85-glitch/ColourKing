<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#1a1f2e"/>

  <!-- Photo 1: Front view -->
  <rect x="15" y="15" width="175" height="120" rx="4" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <rect x="20" y="20" width="165" height="110" rx="2" fill="#1e293b"/>
  <!-- Mini car front -->
  <path d="M55 85 Q55 60 80 55 L120 52 Q145 55 145 85 L145 110 Q145 115 140 115 L60 115 Q55 115 55 110Z" fill="url(#panel)"/>
  <rect x="68" y="68" width="25" height="18" rx="2" fill="#1e3a5f" opacity="0.7"/>
  <rect x="107" y="68" width="25" height="18" rx="2" fill="#1e3a5f" opacity="0.7"/>
  <rect x="85" y="92" width="30" height="5" rx="1" fill="#1e3a5f" opacity="0.5"/>
  <ellipse cx="70" cy="100" rx="5" ry="4" fill="#fbbf24" opacity="0.5"/>
  <ellipse cx="130" cy="100" rx="5" ry="4" fill="#fbbf24" opacity="0.5"/>
  <!-- Damage spot -->
  <circle cx="130" cy="80" r="8" fill="#dc2626" opacity="0.5"/>
  <path d="M126 78 L134 82" stroke="#fca5a5" stroke-width="1" opacity="0.7"/>
  <!-- Number badge -->
  <circle cx="32" cy="32" r="12" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="32" y="37" text-anchor="middle" fill="white" font-family="system-ui,sans-serif" font-size="14" font-weight="700">1</text>
  <!-- Camera icon -->
  <rect x="150" y="96" width="24" height="18" rx="3" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.5"/>
  <circle cx="162" cy="105" r="5" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.5"/>

  <!-- Photo 2: Side view -->
  <rect x="210" y="15" width="175" height="120" rx="4" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <rect x="215" y="20" width="165" height="110" rx="2" fill="#1e293b"/>
  <!-- Mini car side -->
  <path d="M235 95 Q235 75 255 70 L315 65 Q335 70 340 95 L340 110 L235 110Z" fill="url(#panel)"/>
  <rect x="260" y="72" width="25" height="15" rx="2" fill="#1e3a5f" opacity="0.7"/>
  <rect x="295" y="72" width="25" height="15" rx="2" fill="#1e3a5f" opacity="0.7"/>
  <circle cx="255" cy="110" r="12" fill="#111827" stroke="#374151" stroke-width="2"/>
  <circle cx="255" cy="110" r="5" fill="#374151"/>
  <circle cx="325" cy="110" r="12" fill="#111827" stroke="#374151" stroke-width="2"/>
  <circle cx="325" cy="110" r="5" fill="#374151"/>
  <!-- Damage -->
  <path d="M310 80 Q325 76 332 88" fill="none" stroke="#dc2626" stroke-width="2" opacity="0.6"/>
  <circle cx="322" cy="82" r="5" fill="#dc2626" opacity="0.4"/>
  <!-- Number badge -->
  <circle cx="227" cy="32" r="12" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="227" y="37" text-anchor="middle" fill="white" font-family="system-ui,sans-serif" font-size="14" font-weight="700">2</text>

  <!-- Photo 3: Close-up -->
  <rect x="15" y="150" width="175" height="120" rx="4" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <rect x="20" y="155" width="165" height="110" rx="2" fill="#2d4a7a"/>
  <!-- Zoomed damage detail -->
  <path d="M40 200 Q80 185 130 200 Q155 208 160 230 L155 250 Q120 235 80 240 Q50 245 35 235Z" fill="#dc2626" opacity="0.45"/>
  <line x1="50" y1="205" x2="140" y2="210" stroke="#fca5a5" stroke-width="2" opacity="0.7"/>
  <line x1="55" y1="215" x2="150" y2="220" stroke="#fca5a5" stroke-width="1.5" opacity="0.5"/>
  <line x1="45" y1="225" x2="120" y2="232" stroke="#fca5a5" stroke-width="1" opacity="0.4"/>
  <path d="M80 200 Q88 192 100 195 Q105 188 115 192" fill="none" stroke="#fca5a5" stroke-width="2" opacity="0.6"/>
  <!-- Magnifier -->
  <circle cx="140" cy="180" r="18" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>
  <line x1="153" y1="193" x2="165" y2="205" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
  <!-- Number badge -->
  <circle cx="32" cy="167" r="12" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="32" y="172" text-anchor="middle" fill="white" font-family="system-ui,sans-serif" font-size="14" font-weight="700">3</text>

  <!-- Photo 4: Add more slot -->
  <rect x="210" y="150" width="175" height="120" rx="4" fill="#111827" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="297" y="205" text-anchor="middle" fill="#4b5563" font-family="system-ui,sans-serif" font-size="40" font-weight="300">+</text>
  <text x="297" y="230" text-anchor="middle" fill="#4b5563" font-family="system-ui,sans-serif" font-size="11">more angles</text>

  <!-- Label -->
  <rect x="12" y="258" width="180" height="28" rx="4" fill="#065f46" opacity="0.9"/>
  <text x="102" y="277" text-anchor="middle" fill="#34d399" font-family="system-ui,sans-serif" font-size="12" font-weight="600">MULTIPLE ANGLES</text>
  <!-- Checkmark badge -->
  <circle cx="370" cy="25" r="16" fill="#059669" opacity="0.9"/>
  <path d="M362 25 L367 30 L378 19" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>